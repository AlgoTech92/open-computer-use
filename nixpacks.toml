# Nixpacks configuration for Coolify deployment
# Deploys the Computer Use MCP Server (computer-use-server/)
# NOTE: This is a Python project. The package.json is for the workspace Docker image only.

[build]
  cmd = "echo 'Build complete'"

[start]
  cmd = "cd computer-use-server && uvicorn app:app --host 0.0.0.0 --port 8081 --workers 2"

[metadata]
  # MCP server port for Coolify to expose
  port = "8081"
  # Health check endpoint
  healthcheck = "/health"
  # Force Python provider (skip Node.js auto-detect due to package.json)
  providers = ["python"]
