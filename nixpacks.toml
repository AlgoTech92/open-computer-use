# Nixpacks configuration for Coolify deployment
# Deploys the Computer Use MCP Server (computer-use-server/)
# NOTE: This is a Python project. The package.json is for the workspace Docker image only.

[phases]
  # Skip npm install — this is a Python project!
  # The package.json is for the workspace image (Dockerfile), not the MCP server.
  install = """
    cd computer-use-server && pip install --no-cache-dir -r requirements.txt
  """

[build]
  cmd = "echo 'Build complete'"

[start]
  cmd = "cd computer-use-server && uvicorn app:app --host 0.0.0.0 --port 8081 --workers 2"

[metadata]
  # MCP server port for Coolify to expose
  port = "8081"
  # Health check endpoint
  healthcheck = "/health"
  # Force Python provider (skip Node.js auto-detect)
  providers = ["python"]

# Environment variables (override in Coolify UI)
# MCP_API_KEY=***
# DOCKER_IMAGE=open-computer-use:latest
# PUBLIC_BASE_URL=https://your-domain.com
# COMMAND_TIMEOUT=600
# SUB_AGENT_TIMEOUT=3600
